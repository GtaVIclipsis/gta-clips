<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAuth Callback — GTA Clip Uploader</title>
  <style>
    :root { --bg: #0f1117; --card: #181b24; --border: #2a2f3d; --text: #eef1f7; --muted: #9aa3b2; --accent: #f4d35e; --ok: #4ade80; --err: #f87171; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    .wrap { max-width: 780px; margin: 0 auto; padding: 48px 20px; }
    nav { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 36px; font-size: 0.95rem; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover, nav a.active { color: var(--accent); }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
    h1 { font-size: 1.7rem; margin: 0 0 8px; }
    p.sub { color: var(--muted); margin: 0 0 22px; }
    .label { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px; }
    .code-box {
      background: #0b0d12;
      border: 2px solid var(--accent);
      border-radius: 10px;
      padding: 20px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--accent);
      word-break: break-all;
      user-select: all;
      margin-bottom: 16px;
    }
    .url-box {
      background: #0b0d12;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      color: var(--muted);
      word-break: break-all;
      user-select: all;
      margin-bottom: 18px;
    }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    button {
      background: var(--accent);
      color: #111319;
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary { background: #262b38; color: var(--text); }
    button:hover { opacity: 0.92; }
    .status { font-size: 0.92rem; font-weight: 600; color: var(--ok); }
    .error-box { background: rgba(248, 113, 113, 0.12); border: 1px solid var(--err); color: #fecaca; border-radius: 10px; padding: 16px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a href="index.html">Overview</a>
      <a href="terms.html">Terms of Service</a>
      <a href="privacy.html">Privacy Policy</a>
      <a href="callback.html" class="active">OAuth Callback</a>
    </nav>

    <div class="panel">
      <h1>TikTok OAuth Callback</h1>
      <p class="sub">Copy the authorization code or full redirect URL below into your terminal script.</p>

      <div id="success-view" class="hidden">
        <div class="label">Authorization Code (<code>?code=...</code>)</div>
        <div id="code-display" class="code-box"></div>

        <div class="label">Full Redirect URL (for <code>--auth-url</code>)</div>
        <div id="url-display" class="url-box"></div>

        <div class="actions">
          <button id="copy-code-btn" type="button">Copy Code</button>
          <button id="copy-url-btn" class="secondary" type="button">Copy Full URL</button>
          <span id="copy-status" class="status"></span>
        </div>
      </div>

      <div id="error-view" class="error-box hidden"></div>
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const err = params.get("error");
      const errDesc = params.get("error_description");

      const successView = document.getElementById("success-view");
      const errorView = document.getElementById("error-view");
      const codeDisplay = document.getElementById("code-display");
      const urlDisplay = document.getElementById("url-display");
      const copyStatus = document.getElementById("copy-status");

      if (err) {
        errorView.textContent = "Authorization error: " + err + (errDesc ? " (" + errDesc + ")" : "");
        errorView.classList.remove("hidden");
        return;
      }

      if (!code) {
        errorView.textContent = "No ?code= parameter found in the URL yet. Open this page via the TikTok OAuth redirect.";
        errorView.classList.remove("hidden");
        return;
      }

      codeDisplay.textContent = code;
      urlDisplay.textContent = window.location.href;
      successView.classList.remove("hidden");

      function copyText(text, label) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            copyStatus.textContent = label + " copied!";
          }).catch(function () {
            fallbackCopy(text, label);
          });
        } else {
          fallbackCopy(text, label);
        }
      }

      function fallbackCopy(text, label) {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        copyStatus.textContent = label + " copied!";
      }

      document.getElementById("copy-code-btn").addEventListener("click", function () {
        copyText(code, "Code");
      });
      document.getElementById("copy-url-btn").addEventListener("click", function () {
        copyText(window.location.href, "Full URL");
      });
    })();
  </script>
</body>
</html>
